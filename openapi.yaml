  /operaciones/vuelos/v1/disrupciones/reservas/{bookingId}/reubicaciones:
    post:
      tags:
      - Reubicaciones
      operationId: createRebooking
      summary: Ejecuta una solicitud idempotente de reacomodacion de vuelo
      description: 'Valida elegibilidad determinista de la opcion solicitada (cupo familiar, vigencia TTL y tarifa
        sin costo por R3), garantiza idempotencia en PostgreSQL mediante restriccion unica `(booking_id, idempotency_key)`
        y protege la reserva ante timeouts upstream (`503`) persistiendo el estado `INDETERMINATE_PENDING_RECONCILIATION`.


        <!-- matriz:inicio -->


        #### Resultado real por valor enviado

        Cada fila es una ejecución real contra el servicio. Los demás campos llevan el valor del ejemplo.


        | Campo | Caso | Valor enviado | HTTP | Respuesta |

        |---|---|---|---|---|

        | optionId | Creacion exitosa con opcion elegible O1 (201) | `O1` | 201 | respuesta exitosa |

        | Idempotency-Key | Sin cabecera Idempotency-Key (400) | — | 400 | codigoRespuesta INVALID_IDEMPOTENCY_KEY
        |

        | Idempotency-Key | Idempotency-Key demasiado corta (<8 chars) | `short` | 400 | codigoRespuesta INVALID_IDEMPOTENCY_KEY
        |

        | Idempotency-Key | Idempotency-Key demasiado larga (>64 chars) | `kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk`
        | 400 | codigoRespuesta INVALID_IDEMPOTENCY_KEY |

        | Idempotency-Key | Idempotency-Key con espacios o inyeccion | `bad key <script>` | 400 | codigoRespuesta
        INVALID_IDEMPOTENCY_KEY |

        | optionId | optionId vacio | `""` | 400 | codigoRespuesta INVALID_REQUEST_FIELD |

        | optionId | optionId formato invalido (FLIGHT-1) | `FLIGHT-1` | 400 | codigoRespuesta INVALID_REQUEST_FIELD
        |

        | optionId | optionId con SQL Injection | `O1'' OR ''1''=''1` | 400 | codigoRespuesta INVALID_REQUEST_FIELD
        |

        | body | Propiedad extra forceFreeRebook (Mass Assignment) | `{"optionId":"O1","forceFreeRebook":true}`
        | 400 | codigoRespuesta MALFORMED_OR_UNKNOWN_PAYLOAD |


        #### Requests HTTP inusuales (método, ruta, cabeceras, codificación, tamaño)

        Algunos los rechaza el servidor web antes de llegar a la aplicación: responden con su propia página (no
        JSON).


        | Campo | Caso | Valor enviado | HTTP | Respuesta |

        |---|---|---|---|---|

        | Content-Type | Content-Type application/xml no soportado (415) | `application/xml` | 415 | codigoRespuesta
        UNSUPPORTED_MEDIA_TYPE |

        | HTTP Method | Verbo PUT no permitido en reubicaciones (405) | `PUT` | 405 | codigoRespuesta METHOD_NOT_ALLOWED
        |


        #### Respuesta ante cada situación de los sistemas de destino


        | Sistema | Situación | HTTP | Respuesta |

        |---|---|---|---|

        | idempotency_store | Reintento idempotente con misma llave y opcion O1 (replayedIdempotent=true) | 201
        | respuesta exitosa |

        | idempotency_store | Conflicto 409 al reutilizar llave con distinta opcion O2 | 409 | codigoRespuesta IDEMPOTENCY_PAYLOAD_MISMATCH
        |

        | idempotency_store | Conflicto 409 al intentar segunda reubicacion activa en misma reserva | 409 | codigoRespuesta
        BOOKING_REBOOKING_ALREADY_ACTIVE_OR_INDETERMINATE |

        | eligibility_guard | Rechazo 422 por opcion O2 sin asientos suficientes en CONFL1 | 422 | codigoRespuesta
        OPTION_NOT_ELIGIBLE |

        | eligibility_guard | Rechazo 422 por opcion O3 de tipo REFUND no elegible en CONFL1 | 422 | codigoRespuesta
        OPTION_NOT_ELIGIBLE |

        | eligibility_guard | Rechazo 422 por opcion inexistente O99 en CONFL1 | 422 | codigoRespuesta OPTION_NOT_FOUND_OR_INELIGIBLE
        |

        | eligibility_guard | Rechazo 422 por catalogo vencido (TTL expirado) en EXP123 | 422 | codigoRespuesta
        OPTION_NOT_ELIGIBLE |

        | create_rebooking_request | Timeout 503 UPSTREAM_TIMEOUT registra estado indeterminado en TIM503 | 503
        | codigoRespuesta UPSTREAM_TIMEOUT |

        | create_rebooking_request | Reintento con misma llave tras timeout retorna 503 pendiente de reconciliacion
        | 503 | codigoRespuesta UPSTREAM_TIMEOUT_PENDING_RECONCILIATION |

        | create_rebooking_request | Bloqueo 409 ante intento con nueva llave mientras TIM503 esta indeterminado
        | 409 | codigoRespuesta BOOKING_REBOOKING_ALREADY_ACTIVE_OR_INDETERMINATE |


        <!-- matriz:fin -->'
