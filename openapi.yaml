openapi: 3.0.3
info:
  title: LATAM Disruption Companion API
  version: 1.0.0
  description: 'Microservicio Backend Hexagonal para gestion determinista e hibrida (IA gobernada) de disrupciones
    de vuelos, conexiones perdidas, elegibilidad de politicas, reubicaciones idempotentes y escalamiento humano
    prioritario.

    '
  contact:
    name: Edwin Ferreira
    email: edwinferreira92@gmail.com
servers:
- url: http://localhost:8080
  description: Entorno local certificado en Docker Compose (Java 25 + Spring Boot 4.1.2 + PostgreSQL 17)
tags:
- name: Evaluaciones
  description: Diagnostico determinista de disrupcion, reconciliacion de eventos y filtrado de opciones.
- name: Consultas
  description: Resolucion hibrida de consultas abiertas mediante el Sandwich de Seguridad de IA (cero PII).
- name: Reubicaciones
  description: Ejecucion idempotente de cambios de vuelo con proteccion ante timeouts indeterminados.
- name: Escalamientos
  description: Creacion idempotente de casos prioritarios para especialistas humanos.
paths:
  /operaciones/vuelos/v1/disrupciones/reservas/{bookingId}/evaluaciones:
    get:
      tags:
      - Evaluaciones
      operationId: evaluateDisruption
      summary: Evalua el estado operativo del viaje, perdida de conexion y opciones elegibles
      description: 'Reconcilia eventos operacionales descartando fuentes degradadas (`_meta.sources_degraded`),
        calcula perdida de conexion contra el tiempo minimo de conexion (MCT = 60 min), evalua reglas de la politica
        vigente (`POL-DELAY-2026-03`) y filtra opciones candidatas segun vigencia TTL, capacidad del grupo y tarifa.


        <!-- matriz:inicio -->


        #### Resultado real por valor enviado

        Cada fila es una ejecución real contra el servicio. Los demás campos llevan el valor del ejemplo.


        | Campo | Caso | Valor enviado | HTTP | Respuesta |

        |---|---|---|---|---|

        | bookingId | Caso base valido ABC123 | `ABC123` | 200 | respuesta exitosa |

        | bookingId | Menor longitud minima (5 chars) | `ABC12` | 400 | codigoRespuesta INVALID_PARAMETER_CONSTRAINT
        |

        | bookingId | Mayor longitud maxima (9 chars) | `ABC123456` | 400 | codigoRespuesta INVALID_PARAMETER_CONSTRAINT
        |

        | bookingId | Minusculas no permitidas | `abc123` | 400 | codigoRespuesta INVALID_PARAMETER_CONSTRAINT |

        | bookingId | Caracteres especiales guion | `ABC-12` | 400 | codigoRespuesta INVALID_PARAMETER_CONSTRAINT
        |

        | bookingId | OWASP SQL Injection | `'' OR 1=1--` | 400 | codigoRespuesta INVALID_PARAMETER_CONSTRAINT |

        | bookingId | OWASP XSS Script Tag | `<script>` | 400 | codigoRespuesta INVALID_PARAMETER_CONSTRAINT |

        | bookingId | OWASP SSTI Expression | `${7*7}` | 400 | codigoRespuesta INVALID_PARAMETER_CONSTRAINT |

        | URI Firewall | OWASP Matrix Parameter Injection (;DROP) | `ABC123;DROP` | 400 | codigoRespuesta MALICIOUS_URI_REJECTED
        |

        | URI Firewall | OWASP Encoded Slash (%2F..) | `ABC%2F..` | 400 | página HTML del servidor web |

        | URI Firewall | OWASP Null Byte (%00) | `ABC123%00` | 400 | página HTML del servidor web |

        | URI Firewall | OWASP CRLF Injection (%0d%0a) | `ABC123%0d%0a` | 400 | codigoRespuesta MALICIOUS_URI_REJECTED
        |


        #### Requests HTTP inusuales (método, ruta, cabeceras, codificación, tamaño)

        Algunos los rechaza el servidor web antes de llegar a la aplicación: responden con su propia página (no
        JSON).


        | Campo | Caso | Valor enviado | HTTP | Respuesta |

        |---|---|---|---|---|

        | HTTP Method | Verbo DELETE no permitido | `DELETE` | 405 | codigoRespuesta METHOD_NOT_ALLOWED |

        | HTTP Method | Verbo POST no permitido en evaluaciones | `POST` | 405 | codigoRespuesta METHOD_NOT_ALLOWED
        |

        | Accept Header | Representacion XML no soportada (406) | `application/xml` | 406 | codigoRespuesta NOT_ACCEPTABLE_REPRESENTATION
        |


        #### Respuesta ante cada situación de los sistemas de destino


        | Sistema | Situación | HTTP | Respuesta |

        |---|---|---|---|

        | get_trip_context | Reserva inexistente ZZZ999 (404) | 404 | codigoRespuesta BOOKING_NOT_FOUND |

        | get_operational_events | Todas las fuentes degradadas ALLDEG (503) | 503 | codigoRespuesta ALL_OPERATIONAL_SOURCES_DEGRADED
        |

        | get_operational_events | Conflicto entre fuentes saludables CONFL1 (200 con escalamiento) | 200 | respuesta
        exitosa |

        | get_eligible_options | Catalogo de opciones con TTL vencido EXP123 | 200 | respuesta exitosa |


        <!-- matriz:fin -->'
      parameters:
      - $ref: '#/components/parameters/BookingIdParam'
