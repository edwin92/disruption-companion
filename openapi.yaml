  /operaciones/vuelos/v1/disrupciones/reservas/{bookingId}/escalamientos:
    post:
      tags:
      - Escalamientos
      operationId: createHumanEscalation
      summary: Crea un caso idempotente de asistencia prioritaria humana sin exponer PII
      description: 'Escala el caso a la cola especializada (`DISRUPTION_L2`) adjuntando evidencia tecnica verificada
        y sanitizada (cero PII crudo), garantizando idempotencia transaccional por `(booking_id, idempotency_key)`.


        <!-- matriz:inicio -->


        #### Resultado real por valor enviado

        Cada fila es una ejecución real contra el servicio. Los demás campos llevan el valor del ejemplo.


        | Campo | Caso | Valor enviado | HTTP | Respuesta |

        |---|---|---|---|---|

        | reason | Creacion exitosa de caso humano (201) | `Grupo familiar con menor de edad requiere asistencia
        prioritaria y pernocta en Lima` | 201 | respuesta exitosa |

        | Idempotency-Key | Sin cabecera Idempotency-Key en escalamiento (400) | — | 400 | codigoRespuesta INVALID_IDEMPOTENCY_KEY
        |

        | reason | Motivo vacio (400) | `""` | 400 | codigoRespuesta INVALID_REQUEST_FIELD |

        | reason | Motivo demasiado corto (<5 chars) | `abc` | 400 | codigoRespuesta INVALID_REQUEST_FIELD |

        | reason | Motivo supera 300 caracteres | ``
        | 400 | codigoRespuesta INVALID_REQUEST_FIELD |

        | body | Propiedad desconocida queueOverride en escalamiento (400) | `{"reason":"Asistencia prioritaria","queueOverride":"VIP"}`
        | 400 | codigoRespuesta MALFORMED_OR_UNKNOWN_PAYLOAD |


        #### Requests HTTP inusuales (método, ruta, cabeceras, codificación, tamaño)

        Algunos los rechaza el servidor web antes de llegar a la aplicación: responden con su propia página (no
        JSON).


        | Campo | Caso | Valor enviado | HTTP | Respuesta |

        |---|---|---|---|---|

        | HTTP Method | Verbo DELETE no permitido en escalamientos (405) | `DELETE` | 405 | codigoRespuesta METHOD_NOT_ALLOWED
        |


        #### Respuesta ante cada situación de los sistemas de destino


        | Sistema | Situación | HTTP | Respuesta |

        |---|---|---|---|

        | idempotency_store | Reintento idempotente de caso humano (replayedIdempotent=true) | 201 | respuesta exitosa
        |

        | idempotency_store | Conflicto 409 al cambiar motivo con la misma Idempotency-Key | 409 | codigoRespuesta
        IDEMPOTENCY_PAYLOAD_MISMATCH |

        | get_trip_context | Reserva inexistente ZZZ999 en escalamiento (404) | 404 | codigoRespuesta BOOKING_NOT_FOUND
        |


        <!-- matriz:fin -->'
      parameters:
      - $ref: '#/components/parameters/BookingIdParam'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationRequestDto'
      responses:
        '201':
          description: Caso humano creado o reproducido idempotentemente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationResponseDto'
              examples:
                reason_Creacion_exitosa_de_caso_humano_201:
                  summary: 'reason: Creacion exitosa de caso humano (201)'
                  description: 'Respuesta real. Se obtiene con:


                    - **reason** — Creacion exitosa de caso humano (201): `Grupo familiar con menor de edad requiere
                    asistencia prioritaria y pernocta en Lima`'
                  value:
                    caseId: HC-4473
                    bookingId: ABC123
                    queue: DISRUPTION_L2
                    slaMinutes: 45
                    reason: Grupo familiar con menor de edad requiere asistencia prioritaria y pernocta en Lima
                    replayedIdempotent: false
                idempotency_store_Reintento_idempotente_de_caso_humano_repla:
                  summary: 'idempotency_store: Reintento idempotente de caso humano (replayedIdempotent=true)'
                  description: 'Respuesta real. Se obtiene con:


                    - **idempotency_store** — Reintento idempotente de caso humano (replayedIdempotent=true): `idem-oas-esc-0001`'
                  value:
                    caseId: HC-4473
                    bookingId: ABC123
                    queue: DISRUPTION_L2
                    slaMinutes: 45
                    reason: Grupo familiar con menor de edad requiere asistencia prioritaria y pernocta en Lima
                    replayedIdempotent: true
        '400':
          description: Cabecera Idempotency-Key o motivo invalido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                Idempotency_Key_Sin_cabecera_Idempotency_Key_en_escalamiento:
                  summary: 'Idempotency-Key: Sin cabecera Idempotency-Key en escalamiento (400)'
                  description: 'Respuesta real. Se obtiene con:


                    - **Idempotency-Key** — Sin cabecera Idempotency-Key en escalamiento (400)'
                  value:
                    code: INVALID_IDEMPOTENCY_KEY
                    codigoRespuesta: INVALID_IDEMPOTENCY_KEY
                    message: La cabecera Idempotency-Key es obligatoria y debe tener entre 8 y 64 caracteres seguros
                    status: 400
                    path: /operaciones/vuelos/v1/disrupciones/reservas/ABC123/escalamientos
                    timestamp: '2026-09-15T11:03:00Z'
                reason_Motivo_vacio_400:
                  summary: 'reason: Motivo vacio (400)'
                  description: 'Respuesta real. Se obtiene con:


                    - **reason** — Motivo vacio (400): `""`'
                  value:
                    code: INVALID_REQUEST_FIELD
                    codigoRespuesta: INVALID_REQUEST_FIELD
                    message: El motivo de escalamiento (reason) es obligatorio
                    status: 400
                    path: /operaciones/vuelos/v1/disrupciones/reservas/ABC123/escalamientos
                    timestamp: '2026-09-15T11:03:00Z'
                reason_Motivo_demasiado_corto_5_chars:
                  summary: codigoRespuesta INVALID_REQUEST_FIELD (2 casos)
                  description: 'Respuesta real. Se obtiene con:


                    - **reason** — Motivo demasiado corto (<5 chars): `abc`

                    - **reason** — Motivo supera 300 caracteres: ``'
                  value:
                    code: INVALID_REQUEST_FIELD
                    codigoRespuesta: INVALID_REQUEST_FIELD
                    message: El motivo debe tener entre 5 y 300 caracteres
                    status: 400
                    path: /operaciones/vuelos/v1/disrupciones/reservas/ABC123/escalamientos
                    timestamp: '2026-09-15T11:03:00Z'
                body_Propiedad_desconocida_queueOverride_en_escalamiento_400:
                  summary: 'body: Propiedad desconocida queueOverride en escalamiento (400)'
                  description: 'Respuesta real. Se obtiene con:


                    - **body** — Propiedad desconocida queueOverride en escalamiento (400): `{"reason":"Asistencia
                    prioritaria","queueOverride":"VIP"}`'
                  value:
                    code: MALFORMED_OR_UNKNOWN_PAYLOAD
                    codigoRespuesta: MALFORMED_OR_UNKNOWN_PAYLOAD
                    message: El cuerpo JSON o las cabeceras de la solicitud son invalidos o contienen propiedades
                      no permitidas
                    status: 400
                    path: /operaciones/vuelos/v1/disrupciones/reservas/ABC123/escalamientos
                    timestamp: '2026-09-15T11:03:00Z'
        '404':
          description: Reserva no encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                get_trip_context_Reserva_inexistente_ZZZ999_en_escalamiento_:
                  summary: 'get_trip_context: Reserva inexistente ZZZ999 en escalamiento (404)'
                  description: 'Respuesta real. Se obtiene con:


                    - **get_trip_context** — Reserva inexistente ZZZ999 en escalamiento (404): `ZZZ999`'
                  value:
                    code: BOOKING_NOT_FOUND
                    codigoRespuesta: BOOKING_NOT_FOUND
                    message: No se encontro contexto de viaje para la reserva solicitada
                    status: 404
                    path: /operaciones/vuelos/v1/disrupciones/reservas/ZZZ999/escalamientos
                    timestamp: '2026-09-15T11:03:00Z'
        '405':
          description: Metodo HTTP no permitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                HTTP_Method_Verbo_DELETE_no_permitido_en_escalamientos_405:
                  summary: 'HTTP Method: Verbo DELETE no permitido en escalamientos (405)'
                  description: 'Respuesta real. Se obtiene con:


                    - **HTTP Method** — Verbo DELETE no permitido en escalamientos (405): `DELETE`'
                  value:
                    code: METHOD_NOT_ALLOWED
                    codigoRespuesta: METHOD_NOT_ALLOWED
                    message: El verbo HTTP utilizado no esta soportado en este recurso
                    status: 405
                    path: /operaciones/vuelos/v1/disrupciones/reservas/ABC123/escalamientos
                    timestamp: '2026-09-15T11:03:00Z'
        '409':
          description: Conflicto de idempotencia por cambio de motivo con la misma llave.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
              examples:
                idempotency_store_Conflicto_409_al_cambiar_motivo_con_la_mis:
                  summary: 'idempotency_store: Conflicto 409 al cambiar motivo con la misma Idempotency-Key'
                  description: 'Respuesta real. Se obtiene con:


                    - **idempotency_store** — Conflicto 409 al cambiar motivo con la misma Idempotency-Key: `idem-oas-esc-0001
                    + otro motivo`'
                  value:
                    code: IDEMPOTENCY_PAYLOAD_MISMATCH
                    codigoRespuesta: IDEMPOTENCY_PAYLOAD_MISMATCH
                    message: La llave de idempotencia ya fue utilizada con un motivo de escalamiento distinto
                    status: 409
                    path: /operaciones/vuelos/v1/disrupciones/reservas/ABC123/escalamientos
                    timestamp: '2026-09-15T11:03:00Z'
        '415':
          description: Content-Type no soportado.
          content:
            application/json:
              schema:
