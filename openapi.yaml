components:
  parameters:
    BookingIdParam:
      name: bookingId
      in: path
      required: true
      description: Identificador alfanumerico de la reserva (6 a 8 caracteres en mayusculas).
      schema:
        type: string
        pattern: ^[A-Z0-9]{6,8}$
        example: ABC123
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Llave unica de idempotencia (8 a 64 caracteres seguros).
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]{8,64}$
        example: idem-rebook-2026-0001
  schemas:
    OptionEvaluationDto:
      type: object
      required:
      - optionId
      - type
      - seatsAvailable
      - policyRef
      - confidence
      - eligible
      - rejectionReasons
      properties:
        optionId:
          type: string
          example: O1
        type:
          type: string
          example: REBOOK
        flightNumber:
          type: string
          nullable: true
          example: LA2412
        origin:
          type: string
          nullable: true
          example: LIM
        destination:
          type: string
          nullable: true
          example: MEX
        date:
          type: string
          nullable: true
          example: '2026-09-16'
        departure:
          type: string
          nullable: true
          example: 08:15
        fareDifference:
          type: integer
          format: int64
          nullable: true
          example: 0
        currency:
          type: string
          nullable: true
          example: CLP
        seatsAvailable:
          type: integer
          example: 4
        policyRef:
          type: string
          example: POL-DELAY-2026-03
        confidence:
          type: string
          example: HIGH
        eligible:
          type: boolean
          example: true
        rejectionReasons:
          type: array
          items:
            type: string
    AssessmentResponseDto:
      type: object
      required:
      - bookingId
      - passengerCount
      - includesMinor
      - relevantModification
      - missedConnection
      - primaryDelayMinutes
      - policyVersion
      - appliedRuleIds
      - entitlements
      - requiresHumanApproval
      - overnightRequired
      - blockedByMissingPenaltyAmount
      - optionsExpired
      - evaluatedOptions
      - passengerExplanation
      properties:
        bookingId:
          type: string
          example: ABC123
        passengerCount:
          type: integer
          example: 2
        includesMinor:
          type: boolean
          example: true
        relevantModification:
          type: boolean
          example: true
        missedConnection:
          type: boolean
          example: true
        primaryDelayMinutes:
          type: integer
          example: 160
        updatedDepartureTime:
          type: string
          nullable: true
          example: '17:10'
        updatedGate:
          type: string
          nullable: true
          example: '24'
        sourceConflictDetected:
          type: boolean
          example: false
        discardedSources:
          type: array
          items:
            type: string
        policyVersion:
          type: string
          example: POL-DELAY-2026-03
        appliedRuleIds:
          type: array
          items:
            type: string
        entitlements:
          type: array
          items:
            type: string
        requiresHumanApproval:
          type: boolean
          example: true
        overnightRequired:
          type: boolean
          example: true
        blockedByMissingPenaltyAmount:
          type: boolean
          example: false
        optionsExpired:
          type: boolean
          example: false
        recommendedOptionId:
          type: string
          nullable: true
          example: O1
        recommendedFlightNumber:
          type: string
          nullable: true
          example: LA2412
        evaluatedOptions:
          type: array
          items:
            $ref: '#/components/schemas/OptionEvaluationDto'
        passengerExplanation:
          type: string
    InquiryRequestDto:
      type: object
      additionalProperties: false
      required:
      - question
      properties:
        question:
          type: string
          minLength: 3
          maxLength: 500
          example: ¿Que opciones tengo para llegar a Mexico con mi hijo?
    InquiryResponseDto:
      type: object
      required:
      - bookingId
      - resolutionMode
      - validatedPolicyRef
      - confidenceScore
      - requiresHumanEscalation
      - message
      properties:
        bookingId:
          type: string
          example: ABC123
        resolutionMode:
          type: string
          example: AI_ASSISTED_VALIDATED
        validatedPolicyRef:
          type: string
          example: POL-DELAY-2026-03
        recommendedOptionId:
          type: string
          nullable: true
          example: O1
        confidenceScore:
          type: number
          format: double
          example: 0.94
        requiresHumanEscalation:
          type: boolean
          example: true
        humanCaseId:
          type: string
          nullable: true
          example: HC-4471
        guardrailRejectionReason:
          type: string
          nullable: true
        message:
          type: string
    RebookingRequestDto:
      type: object
      additionalProperties: false
      required:
      - optionId
      properties:
        optionId:
          type: string
          pattern: ^O[0-9]{1,3}$
          example: O1
    RebookingResponseDto:
      type: object
      required:
      - requestId
      - bookingId
      - optionId
      - flightNumber
      - status
      - policyRef
      - expiresAt
      - replayedIdempotent
      properties:
        requestId:
          type: string
          example: RBK-88231
        bookingId:
          type: string
          example: ABC123
        optionId:
          type: string
          example: O1
        flightNumber:
          type: string
          example: LA2412
        status:
          type: string
          example: PENDING_CONFIRMATION
        policyRef:
          type: string
          example: POL-DELAY-2026-03
        notificationId:
          type: string
          nullable: true
          example: NT-9912
        expiresAt:
          type: string
          format: date-time
        replayedIdempotent:
          type: boolean
          example: false
    EscalationRequestDto:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 300
          example: Grupo familiar con menor de edad requiere asistencia de pernocta en Lima
    EscalationResponseDto:
      type: object
      required:
      - caseId
      - bookingId
      - queue
      - slaMinutes
      - reason
      - replayedIdempotent
      properties:
        caseId:
          type: string
          example: HC-4471
        bookingId:
          type: string
          example: ABC123
        queue:
          type: string
          example: DISRUPTION_L2
        slaMinutes:
          type: integer
          example: 45
        reason:
          type: string
