  /operaciones/vuelos/v1/disrupciones/reservas/{bookingId}/consultas:
    post:
      tags:
      - Consultas
      operationId: resolvePassengerInquiry
      summary: Resuelve una consulta del pasajero mediante el Sandwich Determinista + IA Gobernada
      description: 'Anonimiza el contexto eliminando todo PII antes de consultar el adaptador de IA calibrado (temperatura
        0.0, umbral de confianza >= 0.85), valida la salida contra las reglas y opciones aprobadas por el motor
        determinista, y cae a fallback determinista con escalamiento humano automatico ante cualquier alucinacion
        o baja confianza.


        <!-- matriz:inicio -->


        #### Resultado real por valor enviado

        Cada fila es una ejecución real contra el servicio. Los demás campos llevan el valor del ejemplo.


        | Campo | Caso | Valor enviado | HTTP | Respuesta |

        |---|---|---|---|---|

        | question | Consulta estandar sobre conexion y menor | `¿Que opciones tengo para llegar a Mexico con mi
        hijo?` | 200 | respuesta exitosa |

        | question | Consulta con PII en texto que es redactado antes del modelo | `Soy María Silva RUT 12.345.678-9
        correo maria.silva@example.com tel +56 9 8765 4321 ¿mi vuelo?` | 200 | respuesta exitosa |

        | question | Solicitud de compensacion en efectivo (activa regla R4) | `Exijo compensacion en dinero efectivo
        por perder mi conexion` | 200 | respuesta exitosa |

        | question | Pregunta vacia | `""` | 400 | codigoRespuesta INVALID_REQUEST_FIELD |

        | question | Pregunta solo espacios | `   ` | 400 | codigoRespuesta INVALID_REQUEST_FIELD |

        | question | Pregunta menor a 3 caracteres | `ab` | 400 | codigoRespuesta INVALID_REQUEST_FIELD |

        | question | Pregunta supera 500 caracteres | ``
        | 400 | codigoRespuesta INVALID_REQUEST_FIELD |

